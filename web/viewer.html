<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your 3D Model</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1b2433, #0c0f15 70%);
      color: #e7ecf3; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 560px; background: #131922; border: 1px solid #232c3a;
      border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .imgwrap { position: relative; aspect-ratio: 4/3; background: #0c0f15; }
    .imgwrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .badge {
      position: absolute; top: 12px; left: 12px; padding: 6px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 600; backdrop-filter: blur(6px); background: rgba(0,0,0,.5);
    }
    .badge.building { color: #ffcf5c; } .badge.done { color: #5ce6a1; } .badge.error { color: #ff7a7a; }
    .body { padding: 18px 20px 22px; }
    h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }
    .req { color: #9fb0c3; font-size: 14px; margin: 0 0 16px; line-height: 1.4; }
    .meta { color: #6c7a8c; font-size: 12px; margin-bottom: 16px; }
    a.dl {
      display: block; text-align: center; text-decoration: none; padding: 14px;
      border-radius: 12px; font-weight: 650; font-size: 15px;
      background: linear-gradient(135deg, #4f8cff, #6a5cff); color: white;
    }
    a.dl[aria-disabled="true"] { opacity: .4; pointer-events: none; }
    .hint { text-align: center; color: #6c7a8c; font-size: 12px; margin-top: 12px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #2a3444; border-top-color: #6a5cff;
      border-radius: 50%; animation: spin 1s linear infinite; position: absolute;
      top: 50%; left: 50%; margin: -18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="imgwrap">
      <div class="spinner" id="spinner"></div>
      <img id="render" alt="" style="display:none" />
      <div class="badge building" id="badge">…</div>
    </div>
    <div class="body">
      <h1 id="title">Your 3D model</h1>
      <p class="req" id="req"></p>
      <div class="meta" id="meta"></div>
      <a class="dl" id="glb" aria-disabled="true" download>⬇ Download .glb (game-ready)</a>
      <p class="hint">Reply to the text to refine it — e.g. "make it blue, bigger wheels".</p>
    </div>
  </div>

  <script>
    const SID = "__SID__";
    const badge = document.getElementById('badge');
    const img = document.getElementById('render');
    const spinner = document.getElementById('spinner');
    const glb = document.getElementById('glb');
    const req = document.getElementById('req');
    const meta = document.getElementById('meta');

    async function tick() {
      try {
        const r = await fetch(`/api/session/${SID}`, { cache: 'no-store' });
        if (!r.ok) return;
        const s = await r.json();
        badge.textContent = s.status;
        badge.className = 'badge ' + s.status;
        const lastUser = [...s.turns].reverse().find(t => t.role === 'user');
        if (lastUser) req.textContent = '“' + lastUser.text + '”';
        if (s.png) {
          img.src = s.png; img.style.display = 'block'; spinner.style.display = 'none';
        }
        if (s.glb) { glb.href = s.glb; glb.setAttribute('aria-disabled', 'false'); }
        meta.textContent = s.objects.length
          ? `${s.objects.length} parts · ${s.iterations} refine pass${s.iterations === 1 ? '' : 'es'}`
          : '';
      } catch (e) { /* keep polling */ }
    }
    tick();
    setInterval(tick, 2000);
  </script>
</body>
</html>
